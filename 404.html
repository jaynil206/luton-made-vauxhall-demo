<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luton Made: Vauxhall</title>
    <script>
      // Single-Page Apps for GitHub Pages (https://github.com/rafgraph/spa-github-pages)
      // GitHub Pages serves this file for any path it doesn't recognise as a real
      // file (e.g. /exhibition, /<topic-id>). It encodes the requested path into
      // the query string and redirects to index.html, whose restore script
      // (see the <head> of index.html) turns it back into a clean URL so the
      // client-side router in app.js can pick up from there.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
